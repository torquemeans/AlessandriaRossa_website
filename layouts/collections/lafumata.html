{{ define "main" }}

<style>

/* Container */
.lafumata-container {
  max-width: 900px;
  margin: 90px auto 40px auto;
  padding: 0 20px;
  font-family: system-ui, Arial, sans-serif;
}

/* Page header */
.lafumata-header {
  margin-bottom: 30px;
 
}

.lafumata-title {
  font-size: 2.3rem;
  margin: 0 0 10px;
}
.lafumata-items {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
}
/* Each lafumata item */
.lafumata-item {
    display: block;
    width: 100%;
    padding: 22px 30px;
    border: 2px solid #9b3c3c;
    text-decoration: none;
    background: #fff;
    transition: background 0.15s ease;
}

.lafumata-item:hover {
  background: #f0f0f0;
  border-color: #ccc;
}

/* Title link */
.lafumata-item-title {
  font-size: 1.4rem;
 
  text-decoration: none;
  font-weight: 600;
}

.lafumata-item-title:hover {
  text-decoration: underline;
}

/* Meta info */
.lafumata-meta {
 
  font-size: 0.9rem;
  margin: 4px 0 10px 0;
}

/* Summary */
.lafumata-summary {
  font-size: 1.05rem;
  line-height: 1.55;
  margin: 0 0 10px 0;
 
}

</style>

<main class="lafumata-container">

  <header class="lafumata-header">
    <h1 class="lafumata-title">{{ .Title }}</h1>
  </header>

  <section class="lafumata-items">

    {{ .Content }}
    {{ $contents := slice 
      (.Site.GetPage "collections/originals/lafumata/purpose")
    }}

    {{ range $contents }}
      <article class="lafumata-item">
        
        <a class="lafumata-item-title" href="{{ .RelPermalink }}">
          {{ .Title }}
        </a>
        <p class="lafumata-summary">
          {{ if .Summary }}
            {{ .Summary }}
          {{ end }}
        </p>

      </article>
    {{ end }}

  </section>

</main>

{{ end }}
